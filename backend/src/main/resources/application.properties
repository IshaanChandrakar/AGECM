server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/agecm_revised}
spring.datasource.username=${DB_USER:agecm_revised}
spring.datasource.password=${DB_PASSWORD:agecm_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health
agecm.mode=${AGECM_MODE:DEMO}
agecm.ingestion-token=${INGESTION_TOKEN:local-development-token}
agecm.reporting-seconds=${REPORT_INTERVAL_SECONDS:20}
agecm.stale-seconds=${STALE_SECONDS:65}
agecm.channel1=${THINGSPEAK_NODE1_CHANNEL_ID:}
agecm.channel2=${THINGSPEAK_NODE2_CHANNEL_ID:}
agecm.origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
agecm.contract-path=${SENSOR_CONTRACT_PATH:}
spring.jackson.deserialization.accept-float-as-int=false

agecm.fixture=${LOCAL_THINGSPEAK_MOCK_ACTIVE:false}
