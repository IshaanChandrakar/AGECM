# AGECM gateway configuration.
# Default profile targets a local PostgreSQL database named "agecm".
# Override with env vars DB_URL / DB_USER / DB_PASS, or run the "demo" profile
# (-Dspring-boot.run.profiles=demo) to use an in-memory H2 DB with zero setup.

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agecm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Allow the React dev server (Vite) to call the API directly if not proxied.
agecm.cors.allowed-origins=http://localhost:5173
