services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agecm_revised
      POSTGRES_USER: agecm_revised
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agecm_local}
    volumes: [agecm-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agecm_revised -d agecm_revised]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agecm_revised
      DB_USER: agecm_revised
      DB_PASSWORD: ${DB_PASSWORD:-agecm_local}
      INGESTION_TOKEN: ${INGESTION_TOKEN:-local-development-token}
      AGECM_MODE: ${AGECM_MODE:-DEMO}
      FRONTEND_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      REPORT_INTERVAL_SECONDS: ${REPORT_INTERVAL_SECONDS:-30}
      STALE_SECONDS: ${STALE_SECONDS:-95}
      THINGSPEAK_NODE1_CHANNEL_ID: ${THINGSPEAK_NODE1_CHANNEL_ID:-}
      THINGSPEAK_NODE2_CHANNEL_ID: ${THINGSPEAK_NODE2_CHANNEL_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; echo -e \"GET /actuator/health HTTP/1.0\r\n\r\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 20
  processing:
    build: ./processing
    environment:
      BACKEND_URL: http://backend:8080
      INGESTION_TOKEN: ${INGESTION_TOKEN:-local-development-token}
      AGECM_MODE: ${AGECM_MODE:-DEMO}
      REPORT_INTERVAL_SECONDS: ${REPORT_INTERVAL_SECONDS:-30}
      CLOUD_POLL_SECONDS: ${CLOUD_POLL_SECONDS:-15}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      REQUEST_RETRIES: ${REQUEST_RETRIES:-2}
      FEATURE_OWNER: ${FEATURE_OWNER:-python}
      WARNING_TILT_RATE: ${WARNING_TILT_RATE:-0.02}
      CRITICAL_TILT_RATE: ${CRITICAL_TILT_RATE:-0.10}
      THINGSPEAK_NODE1_CHANNEL_ID: ${THINGSPEAK_NODE1_CHANNEL_ID:-}
      THINGSPEAK_NODE1_READ_KEY: ${THINGSPEAK_NODE1_READ_KEY:-}
      THINGSPEAK_NODE2_CHANNEL_ID: ${THINGSPEAK_NODE2_CHANNEL_ID:-}
      THINGSPEAK_NODE2_READ_KEY: ${THINGSPEAK_NODE2_READ_KEY:-}
    depends_on:
      backend: {condition: service_healthy}
    restart: on-failure
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: [127.0.0.1:5173:80]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  agecm-data:
